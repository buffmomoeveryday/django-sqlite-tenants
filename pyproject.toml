[project]
name = "django-sqlite-tenants"
version = "0.2.0"
description = "Sqlite Based Multi Tenancy With Django"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<7",
]



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "django-stubs>=6.1.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[tool.ty.src]
include = ["django_sqlite_tenants"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
python_files = ["test_*.py", "tests.py"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
