name: Test and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            django: "Django~=5.2"
          - python: "3.12"
            django: "Django~=5.2"
          - python: "3.12"
            django: "Django~=6.0"
          - python: "3.13"
            django: "Django~=5.2"
          - python: "3.13"
            django: "Django~=6.0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install uv
          uv sync
          uv pip install "${{ matrix.django }}"
      - name: Run checks and tests
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync ty check
          uv run --no-sync python -m django check --settings=tests.settings
          uv run --no-sync pytest
          DJANGO_DEBUG=false DJANGO_SECRET_KEY="ci-only-secret-key-with-at-least-fifty-random-looking-characters" DJANGO_ALLOWED_HOSTS="example.test,.example.test" uv run --no-sync python example/manage.py check --deploy
      - name: Build distributions
        run: uv build

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment: django-sqlite-tenants
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv
      - name: Verify tag matches package version
        run: |
          python -c 'import os,tomllib; expected="v"+tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; actual=os.environ["GITHUB_REF_NAME"]; assert actual == expected, f"tag {actual} != {expected}"'
      - name: Build and publish
        run: |
          uv build
          uv publish --trusted-publishing always

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes
